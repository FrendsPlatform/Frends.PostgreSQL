name: Execute main release
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.PostgreSQL.ExecuteQuery/**'
      - '.github/workflows/Execute_*.yml'
  workflow_dispatch:

jobs:
  main_pipeline:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: main
      os: lin
      workdir: Frends.PostgreSQL.ExecuteQuery
      pretest_command: docker run -p 5432:5432 -e POSTGRES_PASSWORD=mysecretpassword -d postgres
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      target_feed_api_key: ${{ secrets.TASKS_FEED_API_KEY }}
